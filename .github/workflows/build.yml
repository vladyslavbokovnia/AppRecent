name: Build AppRecent APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reconstructed patches
        run: ./scripts/apply_patches.sh
      - name: Prepare APK artifact
        run: cp AppRecent-base.apk AppRecent-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppRecent-debug
          path: AppRecent-debug.apk
