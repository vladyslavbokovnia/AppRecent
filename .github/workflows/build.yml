name: Build Android APK
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AppRecent-2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppRecent-2.0-debug
          path: app/build/outputs/apk/debug/AppRecent-2.0-debug.apk
